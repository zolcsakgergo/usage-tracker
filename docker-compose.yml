services:
  postgres:
    image: postgres:16
    container_name: usage-tracker-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: usage_tracker
    ports:
      - "5433:5432"
    volumes:
      - usage_tracker_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d usage_tracker"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  usage_tracker_pgdata:
